<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid — DSA Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1320;
    --panel: #161D2E;
    --panel-2: #1C2438;
    --border: #2A3349;
    --border-soft: #232B40;
    --text: #E9ECF4;
    --text-dim: #8993AC;
    --text-dimmer: #5C6684;
    --amber: #F0A84E;
    --amber-dim: #6B5330;
    --teal: #5FD4C2;
    --red: #E0665F;
    --cell-empty: #232B40;
    --radius: 3px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 28px 28px;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- Header ---------- */
  header{
    position:relative; z-index:1;
    border-bottom:1px solid var(--border);
    padding:22px 32px;
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px;
    display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr);
    gap:3px;
  }
  .brand-mark span{background:var(--amber); border-radius:2px;}
  .brand-mark span:nth-child(2){background:var(--border-soft);}
  .brand-mark span:nth-child(3){background:var(--border-soft);}
  .brand h1{
    font-family:var(--mono); font-size:19px; font-weight:800; letter-spacing:0.5px;
  }
  .brand p{font-size:12px; color:var(--text-dim); margin-top:2px;}

  .overall{display:flex; align-items:center; gap:16px;}
  .overall-stat{text-align:right;}
  .overall-stat .num{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--amber); line-height:1;}
  .overall-stat .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-top:3px;}
  .overall-grid{display:flex; gap:2px; flex-wrap:wrap; max-width:120px;}
  .overall-grid .cell{width:9px; height:9px; border-radius:1.5px; background:var(--cell-empty);}
  .overall-grid .cell.filled{background:var(--amber);}

  /* ---------- Layout ---------- */
  .layout{
    position:relative; z-index:1;
    display:grid; grid-template-columns:280px 1fr;
    min-height:calc(100vh - 82px);
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .sidebar{border-right:none; border-bottom:1px solid var(--border);}
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--border);
    padding:20px 16px;
    display:flex; flex-direction:column; gap:6px;
  }
  .sidebar-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dimmer);
    padding:0 8px 10px; font-family:var(--mono);
  }
  .topic-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 10px; border-radius:var(--radius); cursor:pointer;
    border:1px solid transparent;
    transition:background 0.12s, border-color 0.12s;
  }
  .topic-item:hover{background:var(--panel);}
  .topic-item.active{background:var(--panel-2); border-color:var(--border);}
  .topic-item .t-name{font-size:13.5px; font-weight:500;}
  .topic-item .t-meta{display:flex; align-items:center; gap:8px;}
  .topic-item .t-count{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .mini-bar{width:34px; height:5px; background:var(--cell-empty); border-radius:3px; overflow:hidden;}
  .mini-bar-fill{height:100%; background:var(--amber);}
  .topic-item.active .t-name{color:var(--amber);}

  .add-topic-btn{
    margin-top:10px;
    padding:10px; border-radius:var(--radius);
    border:1px dashed var(--border);
    background:transparent; color:var(--text-dim);
    font-family:var(--sans); font-size:13px; cursor:pointer;
    transition:border-color 0.12s, color 0.12s;
  }
  .add-topic-btn:hover{border-color:var(--amber); color:var(--amber);}

  /* ---------- Main ---------- */
  main{padding:28px 32px 60px;}
  .topic-header{
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
    margin-bottom:22px; flex-wrap:wrap;
  }
  .topic-header h2{font-family:var(--mono); font-size:24px; font-weight:700;}
  .topic-header .sub{font-size:13px; color:var(--text-dim); margin-top:4px;}
  .topic-progress{display:flex; align-items:center; gap:10px;}
  .topic-progress .grid-cells{display:flex; gap:3px; flex-wrap:wrap; max-width:260px;}
  .topic-progress .cell{width:12px; height:12px; border-radius:2px; background:var(--cell-empty); border:1px solid var(--border-soft);}
  .topic-progress .cell.filled{background:var(--amber); border-color:var(--amber);}
  .topic-progress .frac{font-family:var(--mono); font-size:13px; color:var(--text-dim); white-space:nowrap;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-input{
    flex:1; min-width:180px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 12px; color:var(--text); font-size:13px; font-family:var(--sans);
  }
  .search-input::placeholder{color:var(--text-dimmer);}
  .search-input:focus{outline:none; border-color:var(--teal);}
  .filter-btns{display:flex; gap:6px;}
  .filter-btn{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 13px; color:var(--text-dim); font-size:12px; cursor:pointer; font-family:var(--sans);
  }
  .filter-btn.active{border-color:var(--amber); color:var(--amber);}

  .qlist{display:flex; flex-direction:column; gap:1px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .qrow{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); padding:12px 14px;
    border-bottom:1px solid var(--border-soft);
  }
  .qrow:last-child{border-bottom:none;}
  .qrow.done{background:#141a29;}
  .qrow.done .q-text{color:var(--text-dimmer); text-decoration:line-through; text-decoration-color:var(--text-dimmer);}

  .q-check{
    width:19px; height:19px; border-radius:4px; border:1.5px solid var(--border);
    background:transparent; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--bg); font-size:12px; font-weight:800;
    transition:background 0.12s, border-color 0.12s;
  }
  .qrow.done .q-check{background:var(--amber); border-color:var(--amber);}

  .q-idx{font-family:var(--mono); font-size:12px; color:var(--text-dimmer); width:22px; flex-shrink:0;}
  .q-text{flex:1; font-size:13.5px; min-width:0;}
  .q-tag{
    font-family:var(--mono); font-size:11px; color:var(--teal);
    background:rgba(95,212,194,0.08); border:1px solid rgba(95,212,194,0.25);
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .q-link{
    font-size:11.5px; color:var(--text-dim); text-decoration:none; border-bottom:1px dotted var(--text-dimmer);
    flex-shrink:0;
  }
  .q-link:hover{color:var(--amber); border-color:var(--amber);}
  .q-note-btn{
    background:transparent; border:1px solid var(--border); border-radius:20px; cursor:pointer;
    font-size:11px; color:var(--text-dim); padding:4px 10px; flex-shrink:0;
    font-family:var(--sans); display:flex; align-items:center; gap:5px;
  }
  .q-note-btn:hover{border-color:var(--teal); color:var(--teal);}
  .q-note-btn.has-note{border-color:var(--amber); color:var(--amber);}
  .q-note-btn .dot{width:5px; height:5px; border-radius:50%; background:var(--amber); display:none;}
  .q-note-btn.has-note .dot{display:inline-block;}

  .qwrap{border-bottom:1px solid var(--border-soft);}
  .qwrap:last-child{border-bottom:none;}
  .qwrap .qrow{border-bottom:none;}
  .q-notes-panel{
    display:none; background:#121727; padding:10px 14px 14px 50px;
  }
  .q-notes-panel.open{display:block;}
  .q-notes-panel textarea{
    width:100%; min-height:64px; resize:vertical;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 11px; color:var(--text); font-size:13px; font-family:var(--sans);
  }
  .q-notes-panel textarea:focus{outline:none; border-color:var(--teal);}
  .note-panel-footer{
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:5px;
  }
  .q-notes-panel .note-hint{font-size:10.5px; color:var(--text-dimmer);}
  .q-delete-link{
    background:transparent; border:none; cursor:pointer;
    font-size:11px; color:var(--text-dimmer); font-family:var(--sans);
    padding:3px 4px; text-decoration:underline; text-decoration-color:transparent;
    transition:color 0.12s;
  }
  .q-delete-link:hover{color:var(--red);}
  .q-delete-link.confirming{color:var(--red); text-decoration-color:var(--red); font-weight:600;}

  .empty-state{
    padding:50px 20px; text-align:center; color:var(--text-dim);
    border:1px dashed var(--border); border-radius:var(--radius); font-size:13px;
  }

  /* ---------- Add question form ---------- */
  .add-q-form{
    margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px;
  }
  .add-q-form input{
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 11px; color:var(--text); font-size:13px; font-family:var(--sans);
  }
  .add-q-form input::placeholder{color:var(--text-dimmer);}
  .add-q-form input:focus{outline:none; border-color:var(--teal);}
  .add-q-form .q-name-input{flex:2; min-width:180px;}
  .add-q-form .q-num-input{flex:1; min-width:90px;}
  .add-q-form button{
    background:var(--amber); border:none; border-radius:var(--radius);
    padding:9px 18px; color:#1A1305; font-weight:700; font-size:13px; cursor:pointer;
    font-family:var(--sans);
  }
  .add-q-form button:hover{background:#f3b768;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,10,16,0.7);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:24px; width:100%; max-width:340px;
  }
  .modal h3{font-family:var(--mono); font-size:15px; margin-bottom:14px;}
  .modal input{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 12px; color:var(--text); font-size:13px; margin-bottom:14px; font-family:var(--sans);
  }
  .modal input:focus{outline:none; border-color:var(--teal);}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-actions button{
    padding:8px 16px; border-radius:var(--radius); border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  .modal-actions button.primary{background:var(--amber); border-color:var(--amber); color:#1A1305; font-weight:700;}

  .status-note{
    position:fixed; bottom:18px; right:18px; z-index:60;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 14px; font-size:12px; color:var(--text-dim);
    opacity:0; transform:translateY(6px); transition:opacity 0.2s, transform 0.2s; pointer-events:none;
  }
  .status-note.show{opacity:1; transform:translateY(0);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
    <div>
      <h1>GRID</h1>
      <p>DSA interview prep tracker</p>
    </div>
  </div>
  <div class="overall">
    <div class="overall-grid" id="overallGrid"></div>
    <div class="overall-stat">
      <div class="num" id="overallNum">0/0</div>
      <div class="lbl">solved</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Topics</div>
    <div id="topicList"></div>
    <button class="add-topic-btn" id="addTopicBtn">+ Add topic</button>
  </aside>

  <main>
    <div class="topic-header">
      <div>
        <h2 id="topicTitle">—</h2>
        <div class="sub" id="topicSub"></div>
      </div>
      <div class="topic-progress">
        <div class="grid-cells" id="topicGrid"></div>
        <div class="frac" id="topicFrac">0/0</div>
      </div>
    </div>

    <div class="toolbar">
      <input class="search-input" id="searchInput" placeholder="Search questions in this topic…">
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="done">Solved</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
      </div>
    </div>

    <div class="qlist" id="qlist"></div>

    <form class="add-q-form" id="addQForm">
      <input class="q-name-input" id="qNameInput" placeholder="Question name (e.g. Two Sum)" required>
      <input class="q-num-input" id="qNumInput" placeholder="LeetCode # (optional)">
      <input class="q-num-input" id="qLinkInput" placeholder="Link (optional)">
      <button type="submit">+ Add question</button>
    </form>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>New topic</h3>
    <input id="newTopicInput" placeholder="e.g. Linked Lists, Trees, DP…" maxlength="40">
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button class="primary" id="modalCreate">Create</button>
    </div>
  </div>
</div>

<div class="status-note" id="statusNote">Saved</div>

<script>
(function(){
  const STORAGE_KEY = 'grid-dsa-tracker-v1';

  const seedData = {
    topics: [
      {
        id: 't-arrays',
        name: 'Arrays',
        questions: [
          ['Two Sum','1','https://leetcode.com/problems/two-sum/'],
          ['Best Time to Buy and Sell Stock','121','https://leetcode.com/problems/best-time-to-buy-and-sell-stock/'],
          ['Maximum Subarray','53','https://leetcode.com/problems/maximum-subarray/'],
          ['Merge Sorted Array','88','https://leetcode.com/problems/merge-sorted-array/'],
          ['Remove Duplicates from Sorted Array','26','https://leetcode.com/problems/remove-duplicates-from-sorted-array/'],
          ['Rotate Array','189','https://leetcode.com/problems/rotate-array/'],
          ['Product of Array Except Self','238','https://leetcode.com/problems/product-of-array-except-self/'],
          ['Majority Element','169','https://leetcode.com/problems/majority-element/'],
          ['Move Zeroes','283','https://leetcode.com/problems/move-zeroes/'],
          ['Contains Duplicate','217','https://leetcode.com/problems/contains-duplicate/'],
          ['Find the Missing Number','268','https://leetcode.com/problems/missing-number/'],
          ['Find All Numbers Disappeared in an Array','448','https://leetcode.com/problems/find-all-numbers-disappeared-in-an-array/'],
          ['Sort Colors','75','https://leetcode.com/problems/sort-colors/'],
          ['Next Permutation','31','https://leetcode.com/problems/next-permutation/'],
          ['Trapping Rain Water','42','https://leetcode.com/problems/trapping-rain-water/'],
          ['Container With Most Water','11','https://leetcode.com/problems/container-with-most-water/'],
          ['Gas Station','134','https://leetcode.com/problems/gas-station/'],
          ['Jump Game','55','https://leetcode.com/problems/jump-game/'],
          ['Jump Game II','45','https://leetcode.com/problems/jump-game-ii/'],
          ['Candy','135','https://leetcode.com/problems/candy/'],
        ]
      },
      {
        id: 't-strings',
        name: 'Strings',
        questions: [
          ['Valid Anagram','242','https://leetcode.com/problems/valid-anagram/'],
          ['Valid Palindrome','125','https://leetcode.com/problems/valid-palindrome/'],
          ['Longest Common Prefix','14','https://leetcode.com/problems/longest-common-prefix/'],
          ['Reverse String','344','https://leetcode.com/problems/reverse-string/'],
          ['Reverse Words in a String','151','https://leetcode.com/problems/reverse-words-in-a-string/'],
          ['Implement strStr()','28','https://leetcode.com/problems/find-the-index-of-the-first-occurrence-in-a-string/'],
          ['Longest Palindromic Substring','5','https://leetcode.com/problems/longest-palindromic-substring/'],
          ['Longest Substring Without Repeating Characters','3','https://leetcode.com/problems/longest-substring-without-repeating-characters/'],
          ['Group Anagrams','49','https://leetcode.com/problems/group-anagrams/'],
          ['Valid Parentheses','20','https://leetcode.com/problems/valid-parentheses/'],
          ['String to Integer (atoi)','8','https://leetcode.com/problems/string-to-integer-atoi/'],
          ['Integer to Roman','12','https://leetcode.com/problems/integer-to-roman/'],
          ['Roman to Integer','13','https://leetcode.com/problems/roman-to-integer/'],
          ['Zigzag Conversion','6','https://leetcode.com/problems/zigzag-conversion/'],
          ['Minimum Window Substring','76','https://leetcode.com/problems/minimum-window-substring/'],
          ['Find All Anagrams in a String','438','https://leetcode.com/problems/find-all-anagrams-in-a-string/'],
          ['Isomorphic Strings','205','https://leetcode.com/problems/isomorphic-strings/'],
          ['Word Pattern','290','https://leetcode.com/problems/word-pattern/'],
          ['Decode String','394','https://leetcode.com/problems/decode-string/'],
          ['Encode and Decode Strings','—','']
        ]
      }
    ]
  };

  function makeQ(name, num, link, notes){
    return {
      id: 'q-' + Math.random().toString(36).slice(2,10),
      name: name,
      num: num || '',
      link: link || '',
      done: false,
      notes: notes || ''
    };
  }

  function buildSeed(){
    const topics = seedData.topics.map(t => ({
      id: t.id,
      name: t.name,
      questions: t.questions.map(q => makeQ(q[0], q[1], q[2]))
    }));
    return { topics: topics, activeTopic: topics[0].id };
  }

  let state = null;
  let currentFilter = 'all';
  let searchTerm = '';

  const els = {
    topicList: document.getElementById('topicList'),
    topicTitle: document.getElementById('topicTitle'),
    topicSub: document.getElementById('topicSub'),
    topicGrid: document.getElementById('topicGrid'),
    topicFrac: document.getElementById('topicFrac'),
    qlist: document.getElementById('qlist'),
    overallGrid: document.getElementById('overallGrid'),
    overallNum: document.getElementById('overallNum'),
    searchInput: document.getElementById('searchInput'),
    addQForm: document.getElementById('addQForm'),
    qNameInput: document.getElementById('qNameInput'),
    qNumInput: document.getElementById('qNumInput'),
    qLinkInput: document.getElementById('qLinkInput'),
    modalOverlay: document.getElementById('modalOverlay'),
    newTopicInput: document.getElementById('newTopicInput'),
    statusNote: document.getElementById('statusNote'),
  };

  function showStatus(msg){
    els.statusNote.textContent = msg;
    els.statusNote.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => els.statusNote.classList.remove('show'), 1400);
  }

  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        state = JSON.parse(res.value);
        return;
      }
    }catch(e){ /* key doesn't exist yet */ }
    state = buildSeed();
    await saveState(true);
  }

  async function saveState(silent){
    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      if(result && !silent) showStatus('Saved');
      if(!result) console.error('Storage set returned null');
    }catch(e){
      console.error('Storage error', e);
    }
  }

  function getActiveTopic(){
    return state.topics.find(t => t.id === state.activeTopic) || state.topics[0];
  }

  function renderOverallGrid(){
    let total = 0, done = 0;
    state.topics.forEach(t => t.questions.forEach(q => { total++; if(q.done) done++; }));
    els.overallNum.textContent = done + '/' + total;
    els.overallGrid.innerHTML = '';
    const maxCells = 60;
    const shown = Math.min(total, maxCells);
    const ratio = total ? done/total : 0;
    const filledShown = Math.round(shown * ratio);
    for(let i=0;i<shown;i++){
      const c = document.createElement('div');
      c.className = 'cell' + (i < filledShown ? ' filled' : '');
      els.overallGrid.appendChild(c);
    }
  }

  function renderSidebar(){
    els.topicList.innerHTML = '';
    state.topics.forEach(t => {
      const total = t.questions.length;
      const done = t.questions.filter(q=>q.done).length;
      const item = document.createElement('div');
      item.className = 'topic-item' + (t.id === state.activeTopic ? ' active' : '');
      item.innerHTML = `
        <span class="t-name"></span>
        <span class="t-meta">
          <span class="mini-bar"><span class="mini-bar-fill" style="width:${total ? (done/total*100) : 0}%"></span></span>
          <span class="t-count">${done}/${total}</span>
        </span>`;
      item.querySelector('.t-name').textContent = t.name;
      item.addEventListener('click', () => {
        state.activeTopic = t.id;
        searchTerm = '';
        els.searchInput.value = '';
        renderAll();
      });
      els.topicList.appendChild(item);
    });
  }

  function renderTopicHeader(){
    const t = getActiveTopic();
    if(!t){ els.topicTitle.textContent = 'No topics yet'; els.topicSub.textContent = 'Add a topic to get started.'; els.topicGrid.innerHTML=''; els.topicFrac.textContent='0/0'; return; }
    els.topicTitle.textContent = t.name;
    const total = t.questions.length, done = t.questions.filter(q=>q.done).length;
    els.topicSub.textContent = total ? `${total} questions tracked` : 'No questions yet — add one below';
    els.topicFrac.textContent = `${done}/${total}`;
    els.topicGrid.innerHTML = '';
    t.questions.forEach(q => {
      const c = document.createElement('div');
      c.className = 'cell' + (q.done ? ' filled' : '');
      els.topicGrid.appendChild(c);
    });
  }

  function renderQList(){
    const t = getActiveTopic();
    els.qlist.innerHTML = '';
    if(!t || !t.questions.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = t ? 'No questions in this topic yet. Add your first one below.' : 'Create a topic first.';
      els.qlist.appendChild(empty);
      return;
    }
    let list = t.questions;
    if(currentFilter === 'done') list = list.filter(q=>q.done);
    if(currentFilter === 'pending') list = list.filter(q=>!q.done);
    if(searchTerm) list = list.filter(q => q.name.toLowerCase().includes(searchTerm.toLowerCase()));

    if(!list.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing matches here.';
      els.qlist.appendChild(empty);
      return;
    }

    list.forEach((q) => {
      const idx = t.questions.indexOf(q) + 1;
      const wrap = document.createElement('div');
      wrap.className = 'qwrap';

      const row = document.createElement('div');
      row.className = 'qrow' + (q.done ? ' done' : '');
      row.innerHTML = `
        <button class="q-check" title="Toggle solved">${q.done ? '✓' : ''}</button>
        <span class="q-idx">${String(idx).padStart(2,'0')}</span>
        <span class="q-text"></span>
        ${q.num ? `<span class="q-tag">LC ${q.num}</span>` : ''}
        ${q.link ? `<a class="q-link" href="${q.link}" target="_blank" rel="noopener">Open ↗</a>` : ''}
        <button class="q-note-btn${q.notes ? ' has-note' : ''}" title="Notes"><span class="dot"></span>Notes</button>
      `;
      row.querySelector('.q-text').textContent = q.name;
      row.querySelector('.q-check').addEventListener('click', () => {
        q.done = !q.done;
        saveState();
        renderAll();
      });

      const panel = document.createElement('div');
      panel.className = 'q-notes-panel';
      panel.innerHTML = `
        <textarea placeholder="Approach, mistakes, time complexity, things to remember…"></textarea>
        <div class="note-panel-footer">
          <div class="note-hint">Saves automatically as you type</div>
          <button class="q-delete-link">Delete question</button>
        </div>
      `;
      const textarea = panel.querySelector('textarea');
      textarea.value = q.notes;
      let saveTimer;
      textarea.addEventListener('input', () => {
        q.notes = textarea.value;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          await saveState(true);
          const btn = row.querySelector('.q-note-btn');
          btn.classList.toggle('has-note', !!q.notes.trim());
        }, 500);
      });

      const deleteLink = panel.querySelector('.q-delete-link');
      deleteLink.addEventListener('click', async () => {
        if(deleteLink.dataset.confirming === 'true'){
          t.questions = t.questions.filter(x => x.id !== q.id);
          await saveState();
          renderAll();
        } else {
          deleteLink.dataset.confirming = 'true';
          deleteLink.textContent = 'Click again to confirm';
          deleteLink.classList.add('confirming');
          setTimeout(() => {
            deleteLink.dataset.confirming = 'false';
            deleteLink.textContent = 'Delete question';
            deleteLink.classList.remove('confirming');
          }, 2500);
        }
      });

      row.querySelector('.q-note-btn').addEventListener('click', () => {
        panel.classList.toggle('open');
        if(panel.classList.contains('open')) textarea.focus();
      });

      wrap.appendChild(row);
      wrap.appendChild(panel);
      els.qlist.appendChild(wrap);
    });
  }

  function renderAll(){
    renderOverallGrid();
    renderSidebar();
    renderTopicHeader();
    renderQList();
  }

  // ---- Events ----
  els.searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderQList();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderQList();
    });
  });

  els.addQForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = getActiveTopic();
    if(!t) return;
    const name = els.qNameInput.value.trim();
    if(!name) return;
    const num = els.qNumInput.value.trim();
    const link = els.qLinkInput.value.trim();
    t.questions.push(makeQ(name, num, link));
    els.qNameInput.value = ''; els.qNumInput.value = ''; els.qLinkInput.value = '';
    await saveState();
    renderAll();
  });

  document.getElementById('addTopicBtn').addEventListener('click', () => {
    els.newTopicInput.value = '';
    els.modalOverlay.classList.add('show');
    els.newTopicInput.focus();
  });
  document.getElementById('modalCancel').addEventListener('click', () => {
    els.modalOverlay.classList.remove('show');
  });
  document.getElementById('modalCreate').addEventListener('click', async () => {
    const name = els.newTopicInput.value.trim();
    if(!name) return;
    const id = 't-' + Math.random().toString(36).slice(2,10);
    state.topics.push({ id, name, questions: [] });
    state.activeTopic = id;
    els.modalOverlay.classList.remove('show');
    await saveState();
    renderAll();
  });
  els.newTopicInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('modalCreate').click();
  });
  els.modalOverlay.addEventListener('click', (e) => {
    if(e.target === els.modalOverlay) els.modalOverlay.classList.remove('show');
  });

  // ---- Init ----
  (async function init(){
    await loadState();
    renderAll();
  })();
})();
</script>
</body>
</html>
